[project]
name = "langchainyt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mayaannkkk", email = "goyalmayank492@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
